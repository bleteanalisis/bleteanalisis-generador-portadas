<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mas Alla del Gol . Analizador de partidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<!-- pdf.js se carga como script clasico: expone window.pdfjsLib para los modulos -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Mas Alla del Gol</div>
    <div class="h1">Analizador de partidos</div>
    <div class="sub">Sube los informes <em>Post Match Summary</em> de la FIFA. Esta es la mesa de trabajo: comprueba que el dato extraido cuadra antes de convertirlo en laminas.</div>
  </header>

  <label class="drop" id="drop" for="file">
    <div class="plus">+</div>
    <h3>Arrastra los PDF aqui</h3>
    <p>o haz clic para elegirlos . maximo 8 partidos</p>
  </label>
  <input type="file" id="file" accept="application/pdf" multiple>

  <div class="loaded" id="loaded"></div>

  <div class="subjectbar" id="subjectbar" hidden>
    <label for="selSubject">Equipo a analizar</label>
    <select id="selSubject"></select>
    <span class="subjecthint" id="subjecthint"></span>
  </div>

  <div class="empty" id="empty">Aun no has cargado ningun partido.</div>
  <main id="out"></main>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
